<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Servicios</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body>

    <div class="layout-admin">

        <aside class="sidebar-admin">
            <div class="logo-admin">
                <a href="index.html">San Marcos</a>
            </div>

            <nav class="nav-admin">
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="servicios.html">Servicios</a></li>
                    <li><a href="usuarios.html">Usuarios</a></li>
                </ul>
            </nav>
        </aside>

        <div class="contenido-admin">
            <header class="header-admin">
                <h1>Servicios</h1>
                <a href="servicio-nuevo.html" class="boton">Nuevo servicio</a>
            </header>

            <main>
                <section class="tabla-listado">
                    <!-- Este listado se generará dinámicamente con JavaScript en una fase posterior,
                         a partir del catálogo de servicios de la clínica -->
                    <table>
                        <thead>
                            <tr>
                                <th>Código</th>
                                <th>Categoría</th>
                                <th>Nombre del servicio</th>
                                <th>Especie</th>
                                <th>Duración</th>
                                <th>Precio</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpo-tabla-servicios">
                            <tr>
                                <td>SV001</td>
                                <td>Consultas</td>
                                <td>Consulta general</td>
                                <td>Perro / Gato</td>
                                <td>30 min</td>
                                <td>$15.000</td>
                                <td>
                                    <a href="servicio-editar.html">Editar</a>
                                    <button type="button" class="boton-eliminar">Eliminar</button>
                                </td>
                            </tr>
                            <tr>
                                <td>VA001</td>
                                <td>Vacunación</td>
                                <td>Vacuna antirrábica canina</td>
                                <td>Perro</td>
                                <td>10 min</td>
                                <td>$12.000</td>
                                <td>
                                    <a href="servicio-editar.html">Editar</a>
                                    <button type="button" class="boton-eliminar">Eliminar</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </section>
            </main>
        </div>

    </div>

    <script src="../js/admin.js"></script>
</body>
</html>
