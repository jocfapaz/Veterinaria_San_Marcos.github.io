<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador | Editar usuario</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <div class="flex min-h-screen relative">

        <!-- Fondo oscuro (Backdrop) para móvil cuando el menú está abierto -->
        <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/50 z-40 hidden md:hidden transition-opacity"></div>

        <!-- Sidebar (Barra Lateral) -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-slate-900 text-slate-200 flex flex-col transform -translate-x-full transition-transform duration-300 ease-in-out md:relative md:translate-x-0 shrink-0">

            <div class="px-6 py-5 border-b border-slate-800 flex justify-between items-center">
                <a href="index.html" class="flex items-center gap-2 text-white font-bold text-base">
                    <svg class="w-6 h-6 text-emerald-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.684a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                    </svg>
                    <span>Veterinaria San Marcos</span>
                </a>

                <!-- Botón Cerrar (X) Solo visible en móvil -->
                <button id="close-sidebar-btn" class="md:hidden text-slate-400 hover:text-white focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
                <a href="index.html" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">Dashboard</a>
                <a href="servicios.html" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">Servicios</a>
                <a href="productos.html" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white transition-colors">Productos</a>
                <!-- Enlace Activo -->
                <a href="usuarios.html" class="flex items-center gap-2 rounded-lg px-3 py-2 text-sm font-semibold bg-emerald-600 text-white shadow-sm">Usuarios</a>
            </nav>
        </aside>

        <!-- Contenido Principal -->
        <div class="flex-1 flex flex-col min-w-0">
            <header class="bg-white shadow-sm border-b border-slate-100 px-4 md:px-8 py-4 flex items-center gap-4">
                <!-- Botón Menú Hamburguesa -->
                <button id="mobile-menu-btn" class="md:hidden text-slate-600 hover:text-emerald-600 focus:outline-none p-1">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <h1 class="text-xl md:text-2xl font-extrabold text-gray-900 truncate">Editar usuario</h1>
            </header>

            <main class="flex-1 bg-gray-50 px-4 md:px-8 py-6">
                <!-- Contenedor del Formulario -->
                <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-6 max-w-2xl">
                    <form action="#" method="post" id="form-usuario-editar" novalidate class="space-y-5">

                        <!-- El campo RUN debería estar bloqueado (readonly) en la edición -->
                        <div>
                            <label for="run-usuario" class="block text-sm font-medium text-gray-700">Run</label>
                            <input type="text" id="run-usuario" name="run" value="19011022-K" required minlength="7" maxlength="10" readonly
                                   class="mt-1 block w-full rounded-lg border border-gray-300 bg-gray-50 px-3 py-2 shadow-sm text-gray-500 sm:text-sm cursor-not-allowed">
                            <p class="mt-1 text-xs text-gray-500">El RUN del usuario no se puede modificar.</p>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label for="nombre-usuario" class="block text-sm font-medium text-gray-700">Nombre</label>
                                <input type="text" id="nombre-usuario" name="nombre" value="Carlos" required maxlength="50"
                                       class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm">
                                <p class="mt-1 text-xs text-red-600" id="error-nombre-usuario"></p>
                            </div>

                            <div>
                                <label for="apellidos-usuario" class="block text-sm font-medium text-gray-700">Apellidos</label>
                                <input type="text" id="apellidos-usuario" name="apellidos" value="Mendoza Pérez" required maxlength="100"
                                       class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm">
                                <p class="mt-1 text-xs text-red-600" id="error-apellidos-usuario"></p>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div>
                                <label for="correo-usuario" class="block text-sm font-medium text-gray-700">Correo electrónico</label>
                                <input type="email" id="correo-usuario" name="correo" value="carlos.mendoza@correo.cl" required maxlength="100"
                                       class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm">
                                <p class="mt-1 text-xs text-red-600" id="error-correo-usuario"></p>
                            </div>

                            <div>
                                <label for="rol-usuario" class="block text-sm font-medium text-gray-700">Rol del usuario</label>
                                <select id="rol-usuario" name="rol" required
                                        class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm">
                                    <option value="">-- Seleccione el rol --</option>
                                    <option value="administrador">Administrador</option>
                                    <option value="recepcionista" selected>Recepcionista / Operador</option>
                                    <option value="dueno-mascota">Dueño de mascota</option>
                                </select>
                                <p class="mt-1 text-xs text-red-600" id="error-rol-usuario"></p>
                            </div>
                        </div>

                        <div>
                            <label for="fecha-nacimiento-usuario" class="block text-sm font-medium text-gray-700">Fecha de nacimiento (opcional)</label>
                            <input type="date" id="fecha-nacimiento-usuario" name="fecha-nacimiento" value="1995-08-15"
                                   class="mt-1 block w-full sm:w-1/2 rounded-lg border border-gray-300 px-3 py-2 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm">
                        </div>

                        <!-- Ubicación -->
                        <div class="bg-gray-50 p-4 rounded-lg border border-gray-100 space-y-4 mt-2">
                            <h3 class="text-sm font-semibold text-gray-700">Ubicación (Opcional)</h3>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label for="region-usuario" class="block text-sm font-medium text-gray-700">Región</label>
                                    <select id="region-usuario" name="region"
                                            class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm">
                                        <option value="">-- Seleccione la región --</option>
                                        <option value="ohiggins" selected>Región de O'Higgins</option>
                                        <option value="rm">Región Metropolitana</option>
                                    </select>
                                </div>

                                <div>
                                    <label for="comuna-usuario" class="block text-sm font-medium text-gray-700">Comuna</label>
                                    <select id="comuna-usuario" name="comuna"
                                            class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm">
                                        <option value="">-- Seleccione la comuna --</option>
                                        <option value="rancagua" selected>Rancagua</option>
                                        <option value="machali">Machalí</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label for="direccion-usuario" class="block text-sm font-medium text-gray-700">Dirección</label>
                                <input type="text" id="direccion-usuario" name="direccion" value="Av. Siempre Viva 123, Depto 40" maxlength="300"
                                       class="mt-1 block w-full rounded-lg border border-gray-300 px-3 py-2 shadow-sm focus:border-emerald-500 focus:ring-emerald-500 sm:text-sm">
                            </div>
                        </div>

                        <!-- Botones de Acción -->
                        <div class="pt-4 flex items-center gap-3 border-t border-gray-100 mt-6">
                            <button type="submit"
                                    class="inline-flex items-center gap-1 rounded-lg bg-emerald-600 px-5 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-emerald-700 transition-colors">
                                Guardar cambios
                            </button>
                            <a href="usuarios.html" 
                               class="inline-flex items-center gap-1 rounded-lg bg-white border border-gray-300 px-5 py-2.5 text-sm font-medium text-gray-700 shadow-sm hover:bg-gray-50 transition-colors">
                                Cancelar
                            </a>
                        </div>
                    </form>
                </div>
            </main>
        </div>

    </div>

    <!-- Script del Menú Móvil Lateral -->
    <script>
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('sidebar-backdrop');
        const openBtn = document.getElementById('mobile-menu-btn');
        const closeBtn = document.getElementById('close-sidebar-btn');

        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            backdrop.classList.remove('hidden');
        }

        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            backdrop.classList.add('hidden');
        }

        openBtn.addEventListener('click', openSidebar);
        closeBtn.addEventListener('click', closeSidebar);
        backdrop.addEventListener('click', closeSidebar);
    </script>
</body>
</html>
