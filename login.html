<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veterinaria San Marcos | Iniciar sesión</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header>
        <div class="logo">
            <a href="index.html">Veterinaria San Marcos</a>
        </div>

        <nav class="nav-principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="servicios.html">Servicios</a></li>
                <li><a href="nosotros.html">Nosotros</a></li>
                <li><a href="blogs.html">Blog</a></li>
                <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </nav>

        <div class="acciones-usuario">
            <a href="mi-solicitud.html" class="solicitud">Mi solicitud (<span id="solicitud-count">0</span>)</a>
        </div>
    </header>

    <main>
        <section class="seccion-login">
            <img src="img/logo-clinica-placeholder.jpg" alt="Logo Veterinaria San Marcos" class="logo-login">
            <h1>Veterinaria San Marcos</h1>

            <form action="#" method="post" id="form-login" novalidate>
                <h2>Inicio de sesión</h2>

                <div class="campo">
                    <label for="correo-login">Correo</label>
                    <input type="email" id="correo-login" name="correo" required maxlength="100">
                    <span class="mensaje-error" id="error-correo-login"></span>
                </div>

                <div class="campo">
                    <label for="contrasena-login">Contraseña</label>
                    <input type="password" id="contrasena-login" name="contrasena" required minlength="4" maxlength="10">
                    <span class="mensaje-error" id="error-contrasena-login"></span>
                </div>

                <button type="submit" class="boton">Iniciar sesión</button>
                <p class="ayuda-login">¿Aún no tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
            </form>
        </section>
    </main>

    <footer>
        <div class="footer-info">
            <p>Veterinaria San Marcos</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
